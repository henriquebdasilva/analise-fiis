name: FIIs - Radar de Oportunidades (diario)

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"   # todo dia 13h UTC (~10h BRT)

jobs:
  oportunidades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rodar radar de oportunidades
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FIIS: ${{ secrets.FIIS }}
        run: python robo.py --modo oportunidades
      - name: Salvar historico (commit)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add historico.csv || true
          git commit -m "Atualiza historico [skip ci]" || echo "sem mudancas"
          git push || echo "nada a enviar"
