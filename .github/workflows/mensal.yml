name: FIIs - Relatorio Mensal 

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"   # todo dia 12h UTC; o script checa o DIA_DO_MES

jobs:
  mensal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rodar relatorio mensal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FIIS: ${{ secrets.FIIS }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python robo.py --modo mensal
      - name: Salvar historico (commit)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add historico.csv || true
          git commit -m "Atualiza historico [skip ci]" || echo "sem mudancas"
          git push || echo "nada a enviar"
